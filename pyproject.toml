[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-studio-woocommerce-connector"
version = "0.1.0"
description = "Read-only MCP connector that lets an Agent Studio agent read orders, products, inventory and customers from a WooCommerce store."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hema Krishna", email = "hemakrishna742006@gmail.com" }]
keywords = ["mcp", "agent", "woocommerce", "connector", "razorpay", "agent-studio"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=2.3.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
woocommerce-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = ["connector", "mcp_server"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".git", "__pycache__", "demo/wp-data", "demo/db-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length is handled by the formatter, not the linter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
